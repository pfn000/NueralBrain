[package]
name = "bionetic-wasm"
version.workspace = true
edition.workspace = true
description = "WebAssembly bindings for the Bionetic brain"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
bionetic-core = { path = "../bionetic-core" }
bionetic-engine = { path = "../bionetic-engine" }
bionetic-io = { path = "../bionetic-io" }
wasm-bindgen = "0.2"
serde = { workspace = true }
serde_json = { workspace = true }

[profile.release]
opt-level = "z"
lto = true
