[package]
name = "bionetic-wasm"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "WebAssembly bindings for NeuralBrain — browser & HuggingFace deployment."

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
bionetic-core = { path = "../bionetic-core" }
bionetic-engine = { path = "../bionetic-engine" }
bionetic-io = { path = "../bionetic-io" }
bionetic-sdk = { path = "../bionetic-sdk" }
bionetic-vision = { path = "../bionetic-vision" }
bionetic-search = { path = "../bionetic-search" }
bionetic-swarm = { path = "../bionetic-swarm" }

wasm-bindgen = { workspace = true }
js-sys = { workspace = true }
web-sys = { workspace = true, features = [
    "console",
    "Window",
    "Worker",
    "MessageEvent",
    "ImageData",
    "HtmlCanvasElement",
    "CanvasRenderingContext2d",
    "Storage",
] }
serde = { workspace = true }
serde_json = { workspace = true }
serde-wasm-bindgen = "0.6"
