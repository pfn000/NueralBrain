name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Prepare not-yet-added Phase 2 crates
        shell: bash
        run: |
          for crate in bionetic-sdk bionetic-vision bionetic-swarm bionetic-distributed; do
            crate_dir="crates/$crate"
            if [[ ! -f "$crate_dir/Cargo.toml" ]]; then
              mkdir -p "$crate_dir/src"
              cat > "$crate_dir/Cargo.toml" <<EOF
          [package]
          name = "$crate"
          version.workspace = true
          edition.workspace = true
          license.workspace = true
          authors.workspace = true
          repository.workspace = true
          publish = false
          EOF
              printf '%s\n' '// CI-only placeholder; the real crate is added by its scheduled section.' > "$crate_dir/src/lib.rs"
            fi
          done

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v3
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Build
        run: cargo build --all --verbose

      - name: Test
        run: cargo test --all --verbose

      - name: Clippy
        run: cargo clippy --all -- -D warnings

      - name: Test Agent Core and concrete local effectors
        run: cargo test -p bionetic-agent --features "effector-shell effector-fs effector-code" -- --nocapture

      - name: Check all browser and HTTP effector feature paths
        run: cargo check -p bionetic-agent --features all-effectors --all-targets

      - name: Test concept search and agent integration
        run: cargo test -p bionetic-search --features "corpus-json agent" -- --nocapture

      - name: Check full search feature set
        run: cargo check -p bionetic-search --features full --all-targets

      - name: Check vision file source on Rust 1.75
        run: cargo check -p bionetic-vision --features file-source

      - name: Install Linux camera build dependencies
        run: sudo apt-get update && sudo apt-get install -y pkg-config libudev-dev libv4l-dev

      - name: Check full vision stack on stable
        run: cargo +stable check -p bionetic-vision --features full --all-targets

  wasm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Prepare not-yet-added Phase 2 crates
        shell: bash
        run: |
          for crate in bionetic-sdk bionetic-vision bionetic-swarm bionetic-distributed; do
            crate_dir="crates/$crate"
            if [[ ! -f "$crate_dir/Cargo.toml" ]]; then
              mkdir -p "$crate_dir/src"
              cat > "$crate_dir/Cargo.toml" <<EOF
          [package]
          name = "$crate"
          version.workspace = true
          edition.workspace = true
          license.workspace = true
          authors.workspace = true
          repository.workspace = true
          publish = false
          EOF
              printf '%s\n' '// CI-only placeholder; the real crate is added by its scheduled section.' > "$crate_dir/src/lib.rs"
            fi
          done

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Install wasm-pack
        run: cargo +stable install wasm-pack --locked

      - name: Build WASM
        run: |
          cd crates/bionetic-wasm
          wasm-pack build --target web --out-dir ../../web/pkg

      - name: Verify browser package entrypoint
        run: |
          test -s web/pkg/bionetic_wasm.js
          test -s web/pkg/bionetic_wasm_bg.wasm
          grep -F "./pkg/bionetic_wasm.js" web/app.js

      - name: Upload compiled web build
        uses: actions/upload-artifact@v4
        with:
          name: nueralbrain-web-build
          path: web/
          if-no-files-found: error
          retention-days: 3
