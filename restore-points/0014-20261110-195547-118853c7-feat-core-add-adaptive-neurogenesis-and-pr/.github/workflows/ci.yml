name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v3
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Build
        run: cargo build --all --verbose

      - name: Test
        run: cargo test --all --verbose

      - name: Clippy
        run: cargo clippy --all -- -D warnings

  wasm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Install wasm-pack
        run: cargo install wasm-pack

      - name: Build WASM
        run: |
          cd crates/bionetic-wasm
          wasm-pack build --target web --out-dir ../../web/pkg

      - name: Verify browser package entrypoint
        run: |
          test -s web/pkg/bionetic_wasm.js
          test -s web/pkg/bionetic_wasm_bg.wasm
          grep -F "./pkg/bionetic_wasm.js" web/app.js

      - name: Upload compiled web build
        uses: actions/upload-artifact@v4
        with:
          name: nueralbrain-web-build
          path: web/
          if-no-files-found: error
          retention-days: 3
