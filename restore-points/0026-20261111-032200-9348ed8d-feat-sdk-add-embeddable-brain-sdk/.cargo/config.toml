[build]
# Default target is native; override with --target for cross-compilation.

[target.wasm32-unknown-unknown]
rustflags = [
    "-C", "target-feature=+bulk-memory,+mutable-globals",
]

[alias]
# Convenient aliases — run with `cargo <alias>`
wasm       = "build --target wasm32-unknown-unknown --profile release-wasm -p bionetic-wasm"
test-all   = "test --workspace --all-features"
lint       = "clippy --workspace --all-targets --all-features -- -D warnings"
fmt-check  = "fmt --all -- --check"
xi-bench   = "run --release --example train_and_sleep"
build-all  = "build --workspace --release"
