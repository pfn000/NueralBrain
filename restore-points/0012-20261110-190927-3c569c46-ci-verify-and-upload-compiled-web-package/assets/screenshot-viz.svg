<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" width="900" height="500">
  <defs>
    <linearGradient id="vtb" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2d2d2d"/>
      <stop offset="100%" stop-color="#1a1a1a"/>
    </linearGradient>
    <radialGradient id="vglow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00ff88" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#00ff88" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="vglow2" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00ccff" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#00ccff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="vglow3" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ff4488" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#ff4488" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Window -->
  <rect width="900" height="500" rx="8" fill="#050505" stroke="#333"/>
  <rect width="900" height="32" rx="8" fill="url(#vtb)"/>
  <rect x="0" y="24" width="900" height="8" fill="url(#vtb)"/>
  <circle cx="20" cy="16" r="6" fill="#ff5f56"/>
  <circle cx="40" cy="16" r="6" fill="#ffbd2e"/>
  <circle cx="60" cy="16" r="6" fill="#27c93f"/>
  <text x="450" y="20" text-anchor="middle" font-family="monospace" font-size="11" fill="#888">Neural Visualization — Active Processing</text>

  <!-- Background glows for corpus regions -->
  <ellipse cx="200" cy="250" rx="160" ry="140" fill="url(#vglow)"/>
  <ellipse cx="450" cy="250" rx="180" ry="160" fill="url(#vglow2)"/>
  <ellipse cx="700" cy="250" rx="150" ry="130" fill="url(#vglow)"/>

  <!-- Corpus labels -->
  <text x="200" y="55" text-anchor="middle" font-family="monospace" font-size="10" fill="#00ff88" fill-opacity="0.3" letter-spacing="2">SENSORY</text>
  <text x="450" y="55" text-anchor="middle" font-family="monospace" font-size="10" fill="#00ccff" fill-opacity="0.3" letter-spacing="2">ASSOCIATION</text>
  <text x="700" y="55" text-anchor="middle" font-family="monospace" font-size="10" fill="#00ff88" fill-opacity="0.3" letter-spacing="2">MOTOR</text>

  <!-- SENSORY CORPUS dots and connections -->
  <g stroke="#00ff88" stroke-opacity="0.08" fill="none">
    <line x1="120" y1="120" x2="160" y2="180"/>
    <line x1="120" y1="120" x2="200" y2="150"/>
    <line x1="160" y1="180" x2="200" y2="150"/>
    <line x1="160" y1="180" x2="140" y2="250"/>
    <line x1="200" y1="150" x2="250" y2="200"/>
    <line x1="200" y1="150" x2="280" y2="180"/>
    <line x1="140" y1="250" x2="180" y2="300"/>
    <line x1="140" y1="250" x2="220" y2="280"/>
    <line x1="250" y1="200" x2="280" y2="260"/>
    <line x1="250" y1="200" x2="220" y2="280"/>
    <line x1="180" y1="300" x2="220" y2="280"/>
    <line x1="180" y1="300" x2="160" y2="350"/>
    <line x1="220" y1="280" x2="260" y2="320"/>
    <line x1="100" y1="200" x2="160" y2="180"/>
    <line x1="100" y1="200" x2="140" y2="250"/>
    <line x1="240" y1="350" x2="260" y2="320"/>
    <line x1="280" y1="180" x2="280" y2="260"/>
    <line x1="160" y1="350" x2="200" y2="380"/>
    <line x1="240" y1="350" x2="200" y2="380"/>
  </g>

  <!-- Sensory active pulse -->
  <line x1="200" y1="150" x2="250" y2="200" stroke="#00ff88" stroke-opacity="0.5" stroke-width="2">
    <animate attributeName="stroke-opacity" values="0.1;0.6;0.1" dur="0.8s" repeatCount="indefinite"/>
  </line>

  <!-- Sensory dots -->
  <circle cx="100" cy="200" r="3" fill="#00ff88" fill-opacity="0.3"/>
  <circle cx="120" cy="120" r="4" fill="#00ff88" fill-opacity="0.4"/>
  <circle cx="160" cy="180" r="5" fill="#00ff88" fill-opacity="0.5"/>
  <circle cx="200" cy="150" r="6" fill="#00ff88" fill-opacity="0.7">
    <animate attributeName="r" values="6;9;6" dur="0.8s" repeatCount="indefinite"/>
  </circle>
  <circle cx="140" cy="250" r="4" fill="#00ff88" fill-opacity="0.4"/>
  <circle cx="250" cy="200" r="5" fill="#00ff88" fill-opacity="0.6">
    <animate attributeName="r" values="5;7;5" dur="0.8s" repeatCount="indefinite" begin="0.2s"/>
  </circle>
  <circle cx="280" cy="180" r="4" fill="#00ccff" fill-opacity="0.4"/>
  <circle cx="180" cy="300" r="3.5" fill="#00ff88" fill-opacity="0.3"/>
  <circle cx="220" cy="280" r="4" fill="#00ff88" fill-opacity="0.4"/>
  <circle cx="280" cy="260" r="3" fill="#00ccff" fill-opacity="0.3"/>
  <circle cx="160" cy="350" r="3" fill="#00ff88" fill-opacity="0.3"/>
  <circle cx="260" cy="320" r="3.5" fill="#00ff88" fill-opacity="0.3"/>
  <circle cx="240" cy="350" r="3" fill="#00ccff" fill-opacity="0.3"/>
  <circle cx="200" cy="380" r="3" fill="#00ff88" fill-opacity="0.3"/>

  <!-- ASSOCIATION CORPUS -->
  <g stroke="#00ccff" stroke-opacity="0.08" fill="none">
    <line x1="350" y1="120" x2="400" y2="170"/>
    <line x1="350" y1="120" x2="420" y2="140"/>
    <line x1="400" y1="170" x2="450" y2="200"/>
    <line x1="420" y1="140" x2="480" y2="170"/>
    <line x1="420" y1="140" x2="450" y2="200"/>
    <line x1="450" y1="200" x2="480" y2="170"/>
    <line x1="450" y1="200" x2="500" y2="240"/>
    <line x1="480" y1="170" x2="530" y2="200"/>
    <line x1="500" y1="240" x2="530" y2="200"/>
    <line x1="500" y1="240" x2="450" y2="280"/>
    <line x1="450" y1="280" x2="400" y2="310"/>
    <line x1="450" y1="280" x2="500" y2="320"/>
    <line x1="530" y1="200" x2="550" y2="260"/>
    <line x1="550" y1="260" x2="500" y2="320"/>
    <line x1="400" y1="310" x2="420" y2="370"/>
    <line x1="500" y1="320" x2="480" y2="380"/>
    <line x1="420" y1="370" x2="480" y2="380"/>
    <line x1="380" y1="240" x2="400" y2="310"/>
    <line x1="380" y1="240" x2="450" y2="200"/>
    <line x1="350" y1="300" x2="400" y2="310"/>
    <line x1="350" y1="300" x2="380" y2="240"/>
  </g>

  <!-- Association clump highlight -->
  <ellipse cx="470" cy="215" rx="60" ry="45" fill="none" stroke="#00ccff" stroke-opacity="0.12" stroke-width="1.5" stroke-dasharray="5,5">
    <animate attributeName="stroke-opacity" values="0.05;0.2;0.05" dur="2s" repeatCount="indefinite"/>
  </ellipse>
  <text x="470" y="165" text-anchor="middle" font-family="monospace" font-size="7" fill="#00ccff" fill-opacity="0.3">CLUMP #12</text>

  <!-- Association active pulses -->
  <line x1="450" y1="200" x2="480" y2="170" stroke="#00ccff" stroke-width="2.5" stroke-opacity="0.6">
    <animate attributeName="stroke-opacity" values="0.1;0.7;0.1" dur="0.6s" repeatCount="indefinite"/>
  </line>
  <line x1="480" y1="170" x2="530" y2="200" stroke="#00ccff" stroke-width="2" stroke-opacity="0.5">
    <animate attributeName="stroke-opacity" values="0.1;0.6;0.1" dur="0.6s" repeatCount="indefinite" begin="0.15s"/>
  </line>
  <line x1="450" y1="200" x2="500" y2="240" stroke="#00ccff" stroke-width="2" stroke-opacity="0.5">
    <animate attributeName="stroke-opacity" values="0.1;0.6;0.1" dur="0.6s" repeatCount="indefinite" begin="0.15s"/>
  </line>

  <!-- Association dots -->
  <circle cx="350" cy="120" r="3.5" fill="#00ccff" fill-opacity="0.3"/>
  <circle cx="400" cy="170" r="4" fill="#00ccff" fill-opacity="0.4"/>
  <circle cx="420" cy="140" r="4.5" fill="#00ccff" fill-opacity="0.5"/>
  <circle cx="450" cy="200" r="7" fill="#00ccff" fill-opacity="0.8">
    <animate attributeName="r" values="7;10;7" dur="0.6s" repeatCount="indefinite"/>
  </circle>
  <circle cx="480" cy="170" r="6" fill="#00ccff" fill-opacity="0.7">
    <animate attributeName="r" values="6;8;6" dur="0.6s" repeatCount="indefinite" begin="0.1s"/>
  </circle>
  <circle cx="500" cy="240" r="5.5" fill="#00ccff" fill-opacity="0.6">
    <animate attributeName="r" values="5.5;7.5;5.5" dur="0.6s" repeatCount="indefinite" begin="0.2s"/>
  </circle>
  <circle cx="530" cy="200" r="5" fill="#00ccff" fill-opacity="0.6">
    <animate attributeName="r" values="5;7;5" dur="0.6s" repeatCount="indefinite" begin="0.15s"/>
  </circle>
  <circle cx="380" cy="240" r="3.5" fill="#00ccff" fill-opacity="0.3"/>
  <circle cx="350" cy="300" r="3" fill="#00ccff" fill-opacity="0.3"/>
  <circle cx="450" cy="280" r="4" fill="#00ccff" fill-opacity="0.4"/>
  <circle cx="400" cy="310" r="3.5" fill="#00ccff" fill-opacity="0.3"/>
  <circle cx="500" cy="320" r="3.5" fill="#00ccff" fill-opacity="0.3"/>
  <circle cx="550" cy="260" r="3" fill="#00ccff" fill-opacity="0.3"/>
  <circle cx="420" cy="370" r="3" fill="#00ccff" fill-opacity="0.3"/>
  <circle cx="480" cy="380" r="3" fill="#00ccff" fill-opacity="0.3"/>

  <!-- MOTOR CORPUS -->
  <g stroke="#00ff88" stroke-opacity="0.08" fill="none">
    <line x1="620" y1="150" x2="660" y2="200"/>
    <line x1="620" y1="150" x2="700" y2="170"/>
    <line x1="660" y1="200" x2="700" y2="170"/>
    <line x1="660" y1="200" x2="720" y2="240"/>
    <line x1="700" y1="170" x2="750" y2="200"/>
    <line x1="720" y1="240" x2="750" y2="200"/>
    <line x1="720" y1="240" x2="680" y2="290"/>
    <line x1="720" y1="240" x2="760" y2="280"/>
    <line x1="750" y1="200" x2="790" y2="230"/>
    <line x1="680" y1="290" x2="720" y2="330"/>
    <line x1="760" y1="280" x2="720" y2="330"/>
    <line x1="790" y1="230" x2="760" y2="280"/>
    <line x1="720" y1="330" x2="700" y2="380"/>
    <line x1="660" y1="350" x2="700" y2="380"/>
    <line x1="660" y1="350" x2="680" y2="290"/>
  </g>

  <!-- Motor dots -->
  <circle cx="620" cy="150" r="3.5" fill="#00ff88" fill-opacity="0.3"/>
  <circle cx="660" cy="200" r="4" fill="#00ff88" fill-opacity="0.4"/>
  <circle cx="700" cy="170" r="4.5" fill="#00ff88" fill-opacity="0.5"/>
  <circle cx="720" cy="240" r="5" fill="#00ff88" fill-opacity="0.5"/>
  <circle cx="750" cy="200" r="4" fill="#00ff88" fill-opacity="0.4"/>
  <circle cx="680" cy="290" r="3.5" fill="#00ccff" fill-opacity="0.3"/>
  <circle cx="760" cy="280" r="3.5" fill="#00ff88" fill-opacity="0.3"/>
  <circle cx="790" cy="230" r="3" fill="#00ff88" fill-opacity="0.3"/>
  <circle cx="720" cy="330" r="4" fill="#00ff88" fill-opacity="0.4"/>
  <circle cx="660" cy="350" r="3" fill="#00ccff" fill-opacity="0.3"/>
  <circle cx="700" cy="380" r="3" fill="#00ff88" fill-opacity="0.3"/>

  <!-- Cross-corpus connections (trans-binary) -->
  <g stroke="#00ff88" stroke-opacity="0.06" stroke-dasharray="4,6">
    <line x1="280" y1="180" x2="350" y2="120"/>
    <line x1="280" y1="260" x2="380" y2="240"/>
    <line x1="260" y1="320" x2="350" y2="300"/>
    <line x1="550" y1="260" x2="620" y2="150"/>
    <line x1="500" y1="320" x2="660" y2="200"/>
    <line x1="480" y1="380" x2="660" y2="350"/>
  </g>

  <!-- Active trans-binary pulse -->
  <line x1="280" y1="180" x2="350" y2="120" stroke="#ffaa00" stroke-width="1.5" stroke-opacity="0.3" stroke-dasharray="4,4">
    <animate attributeName="stroke-opacity" values="0.1;0.4;0.1" dur="1.5s" repeatCount="indefinite"/>
  </line>

  <!-- Legend -->
  <rect x="20" y="420" width="250" height="65" rx="6" fill="#0a0a0a" stroke="#333" stroke-opacity="0.3"/>
  <circle cx="40" cy="440" r="4" fill="#00ff88" fill-opacity="0.6"/>
  <text x="55" y="444" font-family="monospace" font-size="8" fill="#666">Resting dot</text>
  <circle cx="140" cy="440" r="5" fill="#00ff88" fill-opacity="0.9">
    <animate attributeName="r" values="5;7;5" dur="1s" repeatCount="indefinite"/>
  </circle>
  <text x="155" y="444" font-family="monospace" font-size="8" fill="#666">Firing dot</text>
  <line x1="35" y1="460" x2="65" y2="460" stroke="#00ff88" stroke-opacity="0.5" stroke-width="2"/>
  <text x="75" y="464" font-family="monospace" font-size="8" fill="#666">Active pulse</text>
  <line x1="135" y1="460" x2="165" y2="460" stroke="#ffaa00" stroke-opacity="0.4" stroke-dasharray="4,4"/>
  <text x="175" y="464" font-family="monospace" font-size="8" fill="#666">Trans-binary</text>
  <ellipse cx="50" cy="478" rx="20" ry="10" fill="none" stroke="#00ccff" stroke-opacity="0.2" stroke-dasharray="3,3"/>
  <text x="80" y="482" font-family="monospace" font-size="8" fill="#666">Active clump</text>

  <!-- Stats overlay -->
  <rect x="630" y="420" width="250" height="65" rx="6" fill="#0a0a0a" stroke="#333" stroke-opacity="0.3"/>
  <text x="645" y="438" font-family="monospace" font-size="8" fill="#00ff88" fill-opacity="0.5">Active Clumps: <tspan fill="#00ffff">3</tspan></text>
  <text x="645" y="452" font-family="monospace" font-size="8" fill="#00ff88" fill-opacity="0.5">Firing Rate: <tspan fill="#00ffff">127 Hz</tspan></text>
  <text x="645" y="466" font-family="monospace" font-size="8" fill="#00ff88" fill-opacity="0.5">Trans Channels: <tspan fill="#00ffff">6 active</tspan></text>
  <text x="645" y="480" font-family="monospace" font-size="8" fill="#00ff88" fill-opacity="0.5">Dopamine: <tspan fill="#ff4488">▓▓▓▓░░░░</tspan></text>
</svg>
