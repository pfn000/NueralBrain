<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="1200" height="400">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#010409"/>
    </radialGradient>
    <radialGradient id="glow1" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00ff88" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#00ff88" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00ccff" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#00ccff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="dotGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00ff88" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#00ff88" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#00ff88" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="dotGlow2" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00ccff" stop-opacity="0.6"/>
      <stop offset="50%" stop-color="#00ccff" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#00ccff" stop-opacity="0"/>
    </radialGradient>
    <filter id="blur">
      <feGaussianBlur in="SourceGraphic" stdDeviation="2"/>
    </filter>
    <filter id="blurLarge">
      <feGaussianBlur in="SourceGraphic" stdDeviation="8"/>
    </filter>
    <linearGradient id="lineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00ff88" stop-opacity="0"/>
      <stop offset="50%" stop-color="#00ff88" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#00ff88" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="pulseGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00ccff" stop-opacity="0"/>
      <stop offset="30%" stop-color="#00ccff" stop-opacity="0.8"/>
      <stop offset="70%" stop-color="#00ff88" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#00ff88" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="400" fill="url(#bg)"/>

  <!-- Ambient glows -->
  <ellipse cx="350" cy="200" rx="250" ry="180" fill="url(#glow1)" filter="url(#blurLarge)"/>
  <ellipse cx="850" cy="200" rx="200" ry="150" fill="url(#glow2)" filter="url(#blurLarge)"/>

  <!-- Grid lines (subtle) -->
  <g stroke="#00ff88" stroke-opacity="0.04" stroke-width="1">
    <line x1="0" y1="50" x2="1200" y2="50"/>
    <line x1="0" y1="100" x2="1200" y2="100"/>
    <line x1="0" y1="150" x2="1200" y2="150"/>
    <line x1="0" y1="200" x2="1200" y2="200"/>
    <line x1="0" y1="250" x2="1200" y2="250"/>
    <line x1="0" y1="300" x2="1200" y2="300"/>
    <line x1="0" y1="350" x2="1200" y2="350"/>
    <line x1="100" y1="0" x2="100" y2="400"/>
    <line x1="200" y1="0" x2="200" y2="400"/>
    <line x1="300" y1="0" x2="300" y2="400"/>
    <line x1="400" y1="0" x2="400" y2="400"/>
    <line x1="500" y1="0" x2="500" y2="400"/>
    <line x1="600" y1="0" x2="600" y2="400"/>
    <line x1="700" y1="0" x2="700" y2="400"/>
    <line x1="800" y1="0" x2="800" y2="400"/>
    <line x1="900" y1="0" x2="900" y2="400"/>
    <line x1="1000" y1="0" x2="1000" y2="400"/>
    <line x1="1100" y1="0" x2="1100" y2="400"/>
  </g>

  <!-- Neural network connections (background) -->
  <g stroke="#00ff88" stroke-opacity="0.12" stroke-width="1" fill="none" filter="url(#blur)">
    <!-- Left cluster connections -->
    <path d="M 120,140 Q 180,120 220,170"/>
    <path d="M 120,140 Q 160,200 220,220"/>
    <path d="M 220,170 Q 280,150 320,180"/>
    <path d="M 220,220 Q 270,240 320,230"/>
    <path d="M 220,170 Q 260,200 320,230"/>
    <path d="M 320,180 Q 380,160 420,190"/>
    <path d="M 320,230 Q 370,250 420,240"/>
    <path d="M 320,180 Q 360,220 420,240"/>

    <!-- Right cluster connections -->
    <path d="M 780,150 Q 830,130 880,160"/>
    <path d="M 780,150 Q 820,200 880,210"/>
    <path d="M 880,160 Q 940,140 1000,170"/>
    <path d="M 880,210 Q 940,230 1000,220"/>
    <path d="M 1000,170 Q 1050,160 1080,180"/>
    <path d="M 1000,220 Q 1050,230 1080,210"/>

    <!-- Top scattered -->
    <path d="M 150,60 Q 200,50 250,80"/>
    <path d="M 500,40 Q 550,60 580,50"/>
    <path d="M 900,60 Q 950,40 1000,70"/>

    <!-- Bottom scattered -->
    <path d="M 200,320 Q 250,340 300,310"/>
    <path d="M 600,350 Q 650,330 700,360"/>
    <path d="M 850,330 Q 900,350 950,320"/>

    <!-- Cross connections -->
    <path d="M 420,190 Q 500,160 580,180"/>
    <path d="M 420,240 Q 520,260 620,230"/>
    <path d="M 580,180 Q 660,170 780,150"/>
    <path d="M 620,230 Q 700,240 780,150"/>
  </g>

  <!-- Pulse lines (animated feel) -->
  <g stroke="url(#pulseGrad)" stroke-width="2" fill="none" stroke-opacity="0.4">
    <path d="M 220,170 Q 280,150 320,180 Q 380,160 420,190 Q 500,160 580,180">
      <animate attributeName="stroke-opacity" values="0.1;0.5;0.1" dur="3s" repeatCount="indefinite"/>
    </path>
    <path d="M 580,180 Q 660,170 780,150 Q 830,130 880,160">
      <animate attributeName="stroke-opacity" values="0.1;0.5;0.1" dur="3s" repeatCount="indefinite" begin="1s"/>
    </path>
  </g>

  <!-- Dots (neurons) - Left cluster -->
  <g>
    <circle cx="120" cy="140" r="12" fill="url(#dotGlow)"/>
    <circle cx="120" cy="140" r="4" fill="#00ff88"/>

    <circle cx="220" cy="170" r="14" fill="url(#dotGlow)"/>
    <circle cx="220" cy="170" r="5" fill="#00ff88">
      <animate attributeName="r" values="5;7;5" dur="2s" repeatCount="indefinite"/>
    </circle>

    <circle cx="220" cy="220" r="10" fill="url(#dotGlow2)"/>
    <circle cx="220" cy="220" r="3.5" fill="#00ccff"/>

    <circle cx="320" cy="180" r="12" fill="url(#dotGlow)"/>
    <circle cx="320" cy="180" r="4" fill="#00ff88"/>

    <circle cx="320" cy="230" r="10" fill="url(#dotGlow2)"/>
    <circle cx="320" cy="230" r="3.5" fill="#00ccff"/>

    <circle cx="420" cy="190" r="16" fill="url(#dotGlow)"/>
    <circle cx="420" cy="190" r="5.5" fill="#00ff88">
      <animate attributeName="r" values="5.5;8;5.5" dur="1.5s" repeatCount="indefinite"/>
      <animate attributeName="fill-opacity" values="1;0.6;1" dur="1.5s" repeatCount="indefinite"/>
    </circle>

    <circle cx="420" cy="240" r="10" fill="url(#dotGlow2)"/>
    <circle cx="420" cy="240" r="3" fill="#00ccff"/>
  </g>

  <!-- Dots - Center -->
  <g>
    <circle cx="580" cy="180" r="14" fill="url(#dotGlow)"/>
    <circle cx="580" cy="180" r="5" fill="#00ff88">
      <animate attributeName="r" values="5;7;5" dur="2.5s" repeatCount="indefinite" begin="0.5s"/>
    </circle>

    <circle cx="620" cy="230" r="10" fill="url(#dotGlow2)"/>
    <circle cx="620" cy="230" r="3.5" fill="#00ccff"/>
  </g>

  <!-- Dots - Right cluster -->
  <g>
    <circle cx="780" cy="150" r="14" fill="url(#dotGlow)"/>
    <circle cx="780" cy="150" r="5" fill="#00ff88">
      <animate attributeName="r" values="5;7;5" dur="2s" repeatCount="indefinite" begin="1s"/>
    </circle>

    <circle cx="880" cy="160" r="12" fill="url(#dotGlow)"/>
    <circle cx="880" cy="160" r="4" fill="#00ff88"/>

    <circle cx="880" cy="210" r="10" fill="url(#dotGlow2)"/>
    <circle cx="880" cy="210" r="3.5" fill="#00ccff"/>

    <circle cx="1000" cy="170" r="14" fill="url(#dotGlow)"/>
    <circle cx="1000" cy="170" r="5" fill="#00ff88">
      <animate attributeName="r" values="5;8;5" dur="1.8s" repeatCount="indefinite" begin="0.3s"/>
    </circle>

    <circle cx="1000" cy="220" r="10" fill="url(#dotGlow2)"/>
    <circle cx="1000" cy="220" r="3" fill="#00ccff"/>

    <circle cx="1080" cy="180" r="12" fill="url(#dotGlow)"/>
    <circle cx="1080" cy="180" r="4" fill="#00ff88"/>

    <circle cx="1080" cy="210" r="10" fill="url(#dotGlow2)"/>
    <circle cx="1080" cy="210" r="3" fill="#00ccff"/>
  </g>

  <!-- Scattered small dots -->
  <g fill="#00ff88" fill-opacity="0.3">
    <circle cx="150" cy="60" r="2.5"/>
    <circle cx="250" cy="80" r="2"/>
    <circle cx="500" cy="40" r="2"/>
    <circle cx="580" cy="50" r="2.5"/>
    <circle cx="900" cy="60" r="2"/>
    <circle cx="1000" cy="70" r="2.5"/>
    <circle cx="200" cy="320" r="2"/>
    <circle cx="300" cy="310" r="2.5"/>
    <circle cx="600" cy="350" r="2"/>
    <circle cx="700" cy="360" r="2"/>
    <circle cx="850" cy="330" r="2.5"/>
    <circle cx="950" cy="320" r="2"/>
    <circle cx="80" cy="250" r="1.5"/>
    <circle cx="170" cy="290" r="2"/>
    <circle cx="460" cy="110" r="2"/>
    <circle cx="540" cy="290" r="1.5"/>
    <circle cx="700" cy="120" r="2"/>
    <circle cx="750" cy="280" r="1.5"/>
    <circle cx="1100" cy="130" r="2"/>
    <circle cx="1050" cy="290" r="1.5"/>
  </g>

  <!-- Title -->
  <text x="600" y="178" text-anchor="middle" font-family="'SF Mono', 'Fira Code', 'Courier New', monospace" font-size="52" font-weight="bold" fill="#e6e6e6" letter-spacing="6">
    NeuralBrain
  </text>

  <!-- Subtitle -->
  <text x="600" y="215" text-anchor="middle" font-family="'SF Mono', 'Fira Code', 'Courier New', monospace" font-size="14" fill="#00ff88" letter-spacing="4" fill-opacity="0.8">
    BIONETIC PROCESSING ARCHITECTURE
  </text>

  <!-- Tagline -->
  <text x="600" y="250" text-anchor="middle" font-family="'SF Mono', 'Fira Code', 'Courier New', monospace" font-size="11" fill="#00ff88" fill-opacity="0.5" letter-spacing="2">
    Dots · Pulses · Gates · Rates — No Tokens. No Tensors. No GPU.
  </text>

  <!-- Decorative lines -->
  <line x1="350" y1="228" x2="520" y2="228" stroke="url(#lineGrad)" stroke-width="1"/>
  <line x1="680" y1="228" x2="850" y2="228" stroke="url(#lineGrad)" stroke-width="1"/>

  <!-- Version tag -->
  <rect x="555" y="262" width="90" height="20" rx="10" fill="none" stroke="#00ff88" stroke-opacity="0.3" stroke-width="1"/>
  <text x="600" y="276" text-anchor="middle" font-family="'SF Mono', monospace" font-size="10" fill="#00ff88" fill-opacity="0.5">
    v0.1.0
  </text>

  <!-- Corner accents -->
  <g stroke="#00ff88" stroke-opacity="0.2" stroke-width="1">
    <polyline points="10,30 10,10 30,10" fill="none"/>
    <polyline points="1170,10 1190,10 1190,30" fill="none"/>
    <polyline points="10,370 10,390 30,390" fill="none"/>
    <polyline points="1170,390 1190,390 1190,370" fill="none"/>
  </g>

  <!-- Bottom border glow -->
  <rect x="0" y="396" width="1200" height="4" fill="#00ff88" fill-opacity="0.15"/>
  <rect x="0" y="398" width="1200" height="2" fill="#00ff88" fill-opacity="0.08"/>
</svg>
